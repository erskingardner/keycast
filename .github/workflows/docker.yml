name: Docker Images

# Master produces a tested candidate bundle. Only release.yml moves release tags.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Never let two publishes race for the same mutable tags.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/keycast-api
  SIGNER_IMAGE: ghcr.io/${{ github.repository_owner }}/keycast-signer
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/keycast-web

jobs:
  build:
    name: Build and verify Linux AMD64 candidate images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      packages: write
      # Required to mint the provenance attestations below.
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check product version
        id: version
        run: echo "version=$(python3 scripts/releases/release.py check-version)" >> "$GITHUB_OUTPUT"

      - name: Require the complete CI workflow for this commit
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/releases/release.py wait-ci --sha "$GITHUB_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Gate the code before anything is pushed, including on a branch dispatch
      # where no publication happens at all.
      - name: Build all runtime targets locally
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --build-arg KEYCAST_VERSION=${{ steps.version.outputs.version }} --build-arg KEYCAST_BUILD_REVISION="$GITHUB_SHA" --load --target api-runtime --tag keycast-hardening-api:local .
          docker buildx build --platform linux/amd64 --build-arg KEYCAST_VERSION=${{ steps.version.outputs.version }} --build-arg KEYCAST_BUILD_REVISION="$GITHUB_SHA" --load --target signer-runtime --tag keycast-hardening-signer:local .
          docker buildx build --platform linux/amd64 --build-arg KEYCAST_VERSION=${{ steps.version.outputs.version }} --build-arg KEYCAST_BUILD_REVISION="$GITHUB_SHA" --load --target web-runtime --tag keycast-hardening-web:local .

      - name: Smoke test the local build
        run: scripts/container-smoke.sh

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the unique candidate tag
        if: github.ref == 'refs/heads/master'
        id: tags
        run: echo "candidate=sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      # Unique per workflow attempt; record and test the pushed digests.
      - name: Push API image to its candidate tag
        if: github.ref == 'refs/heads/master'
        id: api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: api-runtime
          platforms: linux/amd64
          build-args: |
            KEYCAST_VERSION=${{ steps.version.outputs.version }}
            KEYCAST_BUILD_REVISION=${{ github.sha }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.API_IMAGE }}:${{ steps.tags.outputs.candidate }}

      - name: Push signer image to its candidate tag
        if: github.ref == 'refs/heads/master'
        id: signer
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: signer-runtime
          platforms: linux/amd64
          build-args: |
            KEYCAST_VERSION=${{ steps.version.outputs.version }}
            KEYCAST_BUILD_REVISION=${{ github.sha }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.SIGNER_IMAGE }}:${{ steps.tags.outputs.candidate }}

      - name: Push web image to its candidate tag
        if: github.ref == 'refs/heads/master'
        id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: web-runtime
          platforms: linux/amd64
          build-args: |
            KEYCAST_VERSION=${{ steps.version.outputs.version }}
            KEYCAST_BUILD_REVISION=${{ github.sha }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.WEB_IMAGE }}:${{ steps.tags.outputs.candidate }}

      # Smoke the exact published artefacts, not a second local build.
      - name: Smoke test the published digests
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          docker image rm -f keycast-hardening-api:local keycast-hardening-signer:local keycast-hardening-web:local
          docker pull "${API_IMAGE}@${{ steps.api.outputs.digest }}"
          docker pull "${SIGNER_IMAGE}@${{ steps.signer.outputs.digest }}"
          docker pull "${WEB_IMAGE}@${{ steps.web.outputs.digest }}"
          docker tag "${API_IMAGE}@${{ steps.api.outputs.digest }}" keycast-hardening-api:local
          docker tag "${SIGNER_IMAGE}@${{ steps.signer.outputs.digest }}" keycast-hardening-signer:local
          docker tag "${WEB_IMAGE}@${{ steps.web.outputs.digest }}" keycast-hardening-web:local
          scripts/container-smoke.sh

      - name: Attest API build provenance
        if: github.ref == 'refs/heads/master'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Attest signer build provenance
        if: github.ref == 'refs/heads/master'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.SIGNER_IMAGE }}
          subject-digest: ${{ steps.signer.outputs.digest }}
          push-to-registry: true

      - name: Attest web build provenance
        if: github.ref == 'refs/heads/master'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true

      - name: Assemble the verified candidate bundle
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/releases/release.py bundle --output release-candidate \
            --api '${{ steps.api.outputs.digest }}' \
            --signer '${{ steps.signer.outputs.digest }}' \
            --web '${{ steps.web.outputs.digest }}'

      - name: Preserve candidate for explicit release
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: release-candidate
          path: release-candidate/*
          if-no-files-found: error
          retention-days: 90

      # The digests an operator copies into .env, with the verify command.
      - name: Report digests for pinning
        if: github.ref == 'refs/heads/master'
        run: |
          {
            echo "## Smoke-tested digests for .env"
            echo
            echo '```sh'
            echo "KEYCAST_API_DIGEST=${{ steps.api.outputs.digest }}"
            echo "KEYCAST_SIGNER_DIGEST=${{ steps.signer.outputs.digest }}"
            echo "KEYCAST_WEB_DIGEST=${{ steps.web.outputs.digest }}"
            echo '```'
            echo
            echo "Verify each before deploying:"
            echo
            echo '```sh'
            for pair in \
              "${API_IMAGE}@${{ steps.api.outputs.digest }}" \
              "${SIGNER_IMAGE}@${{ steps.signer.outputs.digest }}" \
              "${WEB_IMAGE}@${{ steps.web.outputs.digest }}"; do
              echo "gh attestation verify oci://$pair --repo ${{ github.repository }}"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
