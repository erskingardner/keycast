x-keycast-build: &keycast-build
  context: .
  args:
    KEYCAST_UID: ${KEYCAST_UID:-10001}
    KEYCAST_GID: ${KEYCAST_GID:-10001}

x-keycast-hardening: &keycast-hardening
  user: "${KEYCAST_UID:-10001}:${KEYCAST_GID:-10001}"
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  keycast-api:
    <<: *keycast-hardening
    container_name: keycast-api
    build: *keycast-build
    command: api
    expose:
      - "3000"
    volumes:
      - ./database:/app/database:rw
      - ./master.key:/app/master.key:ro
    environment:
      - "ALLOWED_PUBKEYS=${ALLOWED_PUBKEYS:?error}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "api"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - keycast
    labels:
      - "caddy=${DOMAIN:?error}"
      - "caddy.reverse_proxy=/api/* {{upstreams 3000}}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  keycast-web:
    <<: *keycast-hardening
    container_name: keycast-web
    build:
      <<: *keycast-build
      args:
        KEYCAST_UID: ${KEYCAST_UID:-10001}
        KEYCAST_GID: ${KEYCAST_GID:-10001}
        VITE_DOMAIN: ${DOMAIN:?error}
        VITE_ALLOWED_PUBKEYS: ${ALLOWED_PUBKEYS:?error}
    command: web
    expose:
      - "5173"
    depends_on:
      keycast-api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - WAIT_FOR_API=true
      - HOST=0.0.0.0
      - PORT=5173
      - "VITE_DOMAIN=${DOMAIN:?error}"
      - "VITE_ALLOWED_PUBKEYS=${ALLOWED_PUBKEYS:?error}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "web"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - keycast
    labels:
      - "caddy=${DOMAIN:?error}"
      - "caddy.reverse_proxy=/* {{upstreams 5173}}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  keycast-signer:
    <<: *keycast-hardening
    container_name: keycast-signer
    build: *keycast-build
    command: signer
    volumes:
      - ./database:/app/database:rw
      - ./signer/config.toml:/app/signer/config.toml:ro
      - ./master.key:/app/master.key:ro
    environment:
      - RUST_LOG=info,keycast_signer=info
      - MASTER_KEY_PATH=/app/master.key
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "signer"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - keycast
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

networks:
  keycast:
    external: true
    name: keycast
