[workspace]
members = ["api", "core", "signer"]
resolver = "2"

[workspace.dependencies]
base64 = "0.22"
chrono = {version = "0.4", features = ["serde"]}
config = "=0.15.22"
dotenvy = "0.15.7"
nostr = { version = "=0.44.2", features = ["nip04", "nip44", "nip46", "nip49", "nip59"] }
nostr-sdk = { version = "=0.44.1", features = ["nip04", "nip44", "nip49", "nip59"] }
once_cell = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { package = "sqlx-core", version = "=0.8.5", default-features = false, features = [ "_rt-tokio", "migrate", "chrono", "json" ] }
sqlx-sqlite = { version = "=0.8.5", default-features = false, features = [ "bundled", "migrate", "chrono", "json" ] }
thiserror = "2"
tokio = { version = "=1.52.0", features = ["full"] }
tracing = "0.1"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.23.0", features = ["v4"] }
